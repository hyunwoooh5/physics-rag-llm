# Define networks that can be used by services in the Docker Compose file
networks:
  rag-network:
    driver: bridge

# Define the services that make up your app
services:
  # Define a service name qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db # For developing
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - rag-network

  # Define a service name rag-api
  rag-api:
    build: .
    container_name: rag_api_service # For developing
    ports:
      - "8080:8080"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - qdrant
    networks:
      - rag-network
